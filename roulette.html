<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thrive Randomizer — Ruleta de Decisiones</title>
  <meta name="description" content="Ruleta interactiva para tomar decisiones al azar.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/globals.css">
</head>

<body
  class="min-h-screen grid grid-rows-[3.5rem_1fr] bg-dark-bg text-light-text font-sans antialiased selection:bg-primary selection:text-light-text">
  <header class="flex items-center justify-between px-4 bg-dark-bg-alt border-b border-dark-border sticky top-0 z-50"
    role="banner">
    <a href="index.html"
      class="text-lg font-bold bg-gradient-to-br from-primary-light to-secondary bg-clip-text text-transparent hover:no-underline">Thrive
      Randomizer</a>
    <nav class="flex items-center gap-1 overflow-x-auto" aria-label="Navegacion principal">
      <a href="index.html"
        class="inline-flex items-center gap-1 px-4 py-2 rounded-md text-sm font-semibold whitespace-nowrap transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-light text-light-muted hover:text-light-text hover:bg-dark-surface hover:no-underline">Inicio</a>
      <a href="teams.html"
        class="inline-flex items-center gap-1 px-4 py-2 rounded-md text-sm font-semibold whitespace-nowrap transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-light text-light-muted hover:text-light-text hover:bg-dark-surface hover:no-underline">Equipos</a>
      <a href="weighted.html"
        class="inline-flex items-center gap-1 px-4 py-2 rounded-md text-sm font-semibold whitespace-nowrap transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-light text-light-muted hover:text-light-text hover:bg-dark-surface hover:no-underline">Sorteo</a>
      <a href="roulette.html"
        class="inline-flex items-center gap-1 px-4 py-2 rounded-md text-sm font-semibold whitespace-nowrap transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-light text-light-inverse bg-primary hover:text-light-inverse hover:bg-primary-dark">Ruleta</a>
      <a href="dice.html"
        class="inline-flex items-center gap-1 px-4 py-2 rounded-md text-sm font-semibold whitespace-nowrap transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-light text-light-muted hover:text-light-text hover:bg-dark-surface hover:no-underline">Dados</a>
    </nav>
  </header>

  <main class="p-6 w-full mx-auto grid grid-cols-1 lg:grid-cols-[1fr_280px] gap-6 max-w-[1200px]" role="main">
    <section class="min-w-0 animate-fade-in" id="section-roulette" aria-label="Ruleta de decisiones">
      <header class="mb-8">
        <h1 class="text-2xl font-bold mb-2">Ruleta de Decisiones</h1>
        <p class="text-sm text-light-muted">Agrega opciones y gira la ruleta para decidir.</p>
      </header>

      <form id="roulette-options-form" aria-label="Agregar opciones a la ruleta" class="mb-6">
        <p class="flex flex-wrap gap-2 items-center">
          <input
            class="flex-1 min-w-[150px] px-4 py-2 bg-dark-surface border border-dark-border rounded-md text-light-text transition-colors focus:border-primary focus:outline-none focus:ring-[3px] focus:ring-primary/25"
            type="text" id="roulette-label" placeholder="Opcion" aria-label="Texto de la opcion" required>
          <input
            class="w-12 h-10 p-[2px] cursor-pointer bg-dark-surface border border-dark-border rounded-md text-light-text transition-colors focus:border-primary focus:outline-none focus:ring-[3px] focus:ring-primary/25"
            type="color" id="roulette-color" value="#6c5ce7" aria-label="Color del segmento">
          <button type="submit"
            class="inline-flex items-center justify-center gap-2 rounded-md font-semibold transition-all duration-150 disabled:opacity-50 px-2 py-1 text-xs bg-dark-surface text-light-text border border-dark-border hover:bg-dark-surface-hover hover:border-primary"
            aria-label="Agregar opcion">+ Agregar</button>
        </p>
      </form>

      <ul class="flex flex-col gap-2 mb-8" id="roulette-options-list" aria-label="Opciones en la ruleta"></ul>

      <figure class="relative w-full max-w-[400px] aspect-square mx-auto roulette-wrapper">
        <canvas id="roulette-canvas" aria-label="Ruleta de decisiones" class="w-full h-full"></canvas>
      </figure>

      <button type="button"
        class="inline-flex items-center justify-center gap-2 rounded-md font-semibold transition-all duration-150 disabled:opacity-50 px-8 py-4 text-lg bg-accent text-white hover:bg-accent-hover hover:-translate-y-[1px] block mx-auto mt-8"
        id="roulette-spin-btn" disabled>Girar</button>

      <dialog class="m-auto backdrop:bg-black/60 bg-transparent border-0 outline-none p-0" id="roulette-result-overlay"
        aria-label="Resultado de la ruleta">
        <article
          class="bg-gradient-to-br from-dark-surface to-dark-bg-alt border-2 border-primary rounded-xl p-8 text-center min-w-[300px] animate-fade-in shadow-xl">
          <h2
            class="text-4xl font-extrabold bg-gradient-to-br from-primary-light to-secondary bg-clip-text text-transparent mb-6"
            id="roulette-result-text"></h2>
          <button type="button"
            class="inline-flex items-center justify-center gap-2 rounded-md font-semibold transition-all duration-150 disabled:opacity-50 px-4 py-2 text-sm bg-primary text-white hover:bg-primary-dark hover:-translate-y-[1px] hover:shadow-md"
            id="roulette-close-result">Cerrar</button>
        </article>
      </dialog>
    </section>

    <aside
      class="hidden lg:block bg-dark-bg-alt border border-dark-border rounded-lg p-6 overflow-y-auto max-h-[calc(100vh-3.5rem-3rem)] sticky top-[calc(3.5rem+1.5rem)] self-start"
      id="history-aside" aria-label="Historial de operaciones">
      <header class="flex justify-between items-center mb-4">
        <h2 class="font-bold">Historial</h2>
        <button type="button"
          class="inline-flex items-center justify-center gap-2 rounded-md font-semibold transition-all duration-150 disabled:opacity-50 px-2 py-1 text-xs bg-danger text-white hover:bg-danger-dark"
          id="clear-history-btn" aria-label="Limpiar historial">Limpiar</button>
      </header>
      <ul id="history-list" aria-live="polite" class="divide-y divide-dark-border"></ul>
    </aside>
  </main>

  <button type="button"
    class="fixed bottom-4 right-4 w-12 h-12 bg-primary rounded-full text-white text-xl z-[100] lg:hidden flex items-center justify-center shadow-lg hover:bg-primary-dark hover:-translate-y-1 transition-all"
    id="history-toggle-btn" aria-label="Abrir historial">&#9201;</button>

  <script type="module" src="js/app.js"></script>
</body>

</html>
