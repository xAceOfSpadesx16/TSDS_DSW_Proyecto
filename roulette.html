<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thrive Randomizer — Ruleta de Decisiones</title>
  <meta name="description" content="Ruleta interactiva para tomar decisiones al azar.">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modules.css">
</head>
<body class="app-shell">
  <header class="app-header" role="banner">
    <a href="index.html" class="app-header__title">Thrive Randomizer</a>
    <nav class="app-nav" aria-label="Navegacion principal">
      <a href="index.html" class="nav-link">Inicio</a>
      <a href="teams.html" class="nav-link">Equipos</a>
      <a href="weighted.html" class="nav-link">Sorteo</a>
      <a href="roulette.html" class="nav-link nav-link--active">Ruleta</a>
      <a href="dice.html" class="nav-link">Dados</a>
    </nav>
  </header>

  <main class="app-body page-layout" role="main">
    <section class="module-section" id="section-roulette" aria-label="Ruleta de decisiones">
      <header class="module-header">
        <h1 class="module-header__title">Ruleta de Decisiones</h1>
        <p class="module-header__desc">Agrega opciones y gira la ruleta para decidir.</p>
      </header>

      <form id="roulette-options-form" aria-label="Agregar opciones a la ruleta">
        <p class="add-item-form">
          <input class="form-input add-item-form__input" type="text" id="roulette-label" placeholder="Opcion" aria-label="Texto de la opcion" required>
          <input class="form-input" type="color" id="roulette-color" value="#6c5ce7" aria-label="Color del segmento">
          <button type="submit" class="btn btn--secondary btn--sm" aria-label="Agregar opcion">+ Agregar</button>
        </p>
      </form>

      <ul class="roulette-options-list roulette-options-list--spaced" id="roulette-options-list" aria-label="Opciones en la ruleta"></ul>

      <figure class="roulette-canvas-wrapper">
        <canvas id="roulette-canvas" aria-label="Ruleta de decisiones"></canvas>
      </figure>
      <button type="button" class="btn btn--accent btn--lg" id="roulette-spin-btn" disabled>Girar</button>

      <dialog class="roulette-result-overlay" id="roulette-result-overlay" aria-label="Resultado de la ruleta">
        <article class="roulette-result-card">
          <h2 class="roulette-result-card__heading" id="roulette-result-text"></h2>
          <button type="button" class="btn btn--primary" id="roulette-close-result">Cerrar</button>
        </article>
      </dialog>
    </section>

    <aside class="app-aside" id="history-aside" aria-label="Historial de operaciones">
      <header class="app-aside__header">
        <h2 class="app-aside__title">Historial</h2>
        <button type="button" class="btn btn--danger btn--sm" id="clear-history-btn" aria-label="Limpiar historial">Limpiar</button>
      </header>
      <ul id="history-list" aria-live="polite"></ul>
    </aside>
  </main>

  <button type="button" class="history-toggle-btn" id="history-toggle-btn" aria-label="Abrir historial">&#9201;</button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
