<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thrive Randomizer — Sorteo con Pesos</title>
  <meta name="description" content="Sorteo ponderado donde cada participante tiene probabilidad proporcional a su peso.">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modules.css">
</head>
<body class="app-shell">
  <header class="app-header" role="banner">
    <a href="index.html" class="app-header__title">Thrive Randomizer</a>
    <nav class="app-nav" aria-label="Navegacion principal">
      <a href="index.html" class="nav-link">Inicio</a>
      <a href="teams.html" class="nav-link">Equipos</a>
      <a href="weighted.html" class="nav-link nav-link--active">Sorteo</a>
      <a href="roulette.html" class="nav-link">Ruleta</a>
      <a href="dice.html" class="nav-link">Dados</a>
    </nav>
  </header>

  <main class="app-body page-layout" role="main">
    <section class="module-section" id="section-weighted" aria-label="Sorteo con pesos">
      <header class="module-header">
        <h1 class="module-header__title">Sorteo con Pesos</h1>
        <p class="module-header__desc">Cada participante tiene una probabilidad proporcional a su peso.</p>
      </header>

      <form id="weighted-form" aria-label="Formulario de sorteo con pesos">
        <p class="add-item-form">
          <input class="form-input add-item-form__input" type="text" id="weighted-name" placeholder="Nombre del participante" aria-label="Nombre del participante" required>
          <input class="form-input weighted-entry__weight-input" type="number" id="weighted-weight" min="1" max="100" value="1" aria-label="Peso del participante">
          <button type="submit" class="btn btn--secondary btn--sm" aria-label="Agregar participante al sorteo">+ Agregar</button>
        </p>
      </form>

      <ul class="weighted-list" id="weighted-list" aria-label="Participantes del sorteo"></ul>

      <p class="weighted-toggle-row">
        <label class="toggle">
          <input type="checkbox" class="toggle__input" id="weighted-auto-remove" aria-label="Eliminar ganadores automaticamente">
          <small>Auto-eliminar ganadores</small>
        </label>
      </p>

      <p class="weighted-draw-actions">
        <button type="button" class="btn btn--primary btn--lg" id="weighted-draw-btn" disabled>Sortear</button>
        <button type="button" class="btn btn--secondary btn--lg" id="weighted-reset-btn">Reiniciar</button>
      </p>

      <output id="weighted-result" aria-live="polite" aria-label="Resultado del sorteo"></output>
    </section>

    <aside class="app-aside" id="history-aside" aria-label="Historial de operaciones">
      <header class="app-aside__header">
        <h2 class="app-aside__title">Historial</h2>
        <button type="button" class="btn btn--danger btn--sm" id="clear-history-btn" aria-label="Limpiar historial">Limpiar</button>
      </header>
      <ul id="history-list" aria-live="polite"></ul>
    </aside>
  </main>

  <button type="button" class="history-toggle-btn" id="history-toggle-btn" aria-label="Abrir historial">&#9201;</button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
