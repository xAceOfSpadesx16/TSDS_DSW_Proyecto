<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thrive Randomizer — Generador de Equipos</title>
  <meta name="description" content="Divide participantes en equipos equilibrados de forma aleatoria.">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modules.css">
</head>
<body class="app-shell">
  <header class="app-header" role="banner">
    <a href="index.html" class="app-header__title">Thrive Randomizer</a>
    <nav class="app-nav" aria-label="Navegacion principal">
      <a href="index.html" class="nav-link">Inicio</a>
      <a href="teams.html" class="nav-link nav-link--active">Equipos</a>
      <a href="weighted.html" class="nav-link">Sorteo</a>
      <a href="roulette.html" class="nav-link">Ruleta</a>
      <a href="dice.html" class="nav-link">Dados</a>
    </nav>
  </header>

  <main class="app-body page-layout" role="main">
    <section class="module-section" id="section-teams" aria-label="Generador de equipos">
      <header class="module-header">
        <h1 class="module-header__title">Generador de Equipos</h1>
        <p class="module-header__desc">Ingresa participantes y define como agruparlos.</p>
      </header>

      <form class="team-splitter__form" id="team-form" aria-label="Formulario de generacion de equipos">
        <p class="form-group">
          <label class="form-group__label" for="team-participants">Participantes (uno por linea)</label>
          <textarea class="form-textarea" id="team-participants" rows="6" placeholder="Ana&#10;Carlos&#10;Maria&#10;..." aria-required="true"></textarea>
        </p>

        <fieldset class="team-splitter__options">
          <legend class="sr-only">Modo de agrupacion</legend>

          <p class="form-group">
            <label class="form-group__label">Agrupar por</label>
            <menu class="team-splitter__mode-toggle">
              <li><button type="button" class="btn btn--primary btn--sm" id="mode-group-count" aria-pressed="true">
                Cantidad de grupos
              </button></li>
              <li><button type="button" class="btn btn--secondary btn--sm" id="mode-group-size" aria-pressed="false">
                Tamano de grupo
              </button></li>
            </menu>
          </p>

          <p class="form-group">
            <label class="form-group__label" for="team-value" id="team-value-label">Cantidad de grupos</label>
            <input class="form-input" type="number" id="team-value" min="2" value="2" aria-labelledby="team-value-label">
          </p>
        </fieldset>

        <details class="collapsible">
          <summary class="collapsible__trigger">Reglas avanzadas</summary>
          <p class="team-splitter__exclusion-desc">
            Agrega pares de participantes que <strong>no</strong> deben estar en el mismo equipo.
          </p>
          <p class="add-item-form" id="exclusion-form">
            <input class="form-input add-item-form__input" type="text" id="exclusion-a" placeholder="Participante A" aria-label="Participante A de la exclusion">
            <input class="form-input add-item-form__input" type="text" id="exclusion-b" placeholder="Participante B" aria-label="Participante B de la exclusion">
            <button type="button" class="btn btn--secondary btn--sm" id="add-exclusion-btn" aria-label="Agregar regla de exclusion">+ Agregar</button>
          </p>
          <ul class="chip-list" id="exclusion-list" aria-label="Reglas de exclusion activas"></ul>
        </details>

        <p>
          <button type="submit" class="btn btn--primary btn--lg btn--block">Generar Equipos</button>
        </p>
      </form>

      <output id="team-results" class="results-grid" aria-live="polite" aria-label="Equipos generados"></output>
    </section>

    <aside class="app-aside" id="history-aside" aria-label="Historial de operaciones">
      <header class="app-aside__header">
        <h2 class="app-aside__title">Historial</h2>
        <button type="button" class="btn btn--danger btn--sm" id="clear-history-btn" aria-label="Limpiar historial">Limpiar</button>
      </header>
      <ul id="history-list" aria-live="polite"></ul>
    </aside>
  </main>

  <button type="button" class="history-toggle-btn" id="history-toggle-btn" aria-label="Abrir historial">&#9201;</button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
