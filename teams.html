<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thrive Randomizer — Generador de Equipos</title>
  <meta name="description" content="Divide participantes en equipos equilibrados de forma aleatoria.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/globals.css">
</head>

<body
  class="min-h-screen grid grid-rows-[3.5rem_1fr] bg-dark-bg text-light-text font-sans antialiased selection:bg-primary selection:text-light-text">
  <header class="flex items-center justify-between px-4 bg-dark-bg-alt border-b border-dark-border sticky top-0 z-50"
    role="banner">
    <a href="index.html"
      class="text-lg font-bold bg-gradient-to-br from-primary-light to-secondary bg-clip-text text-transparent hover:no-underline">Thrive
      Randomizer</a>
    <nav class="flex items-center gap-1 overflow-x-auto" aria-label="Navegacion principal">
      <a href="index.html"
        class="inline-flex items-center gap-1 px-4 py-2 rounded-md text-sm font-semibold whitespace-nowrap transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-light text-light-muted hover:text-light-text hover:bg-dark-surface hover:no-underline">Inicio</a>
      <a href="teams.html"
        class="inline-flex items-center gap-1 px-4 py-2 rounded-md text-sm font-semibold whitespace-nowrap transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-light text-light-inverse bg-primary hover:text-light-inverse hover:bg-primary-dark">Equipos</a>
      <a href="weighted.html"
        class="inline-flex items-center gap-1 px-4 py-2 rounded-md text-sm font-semibold whitespace-nowrap transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-light text-light-muted hover:text-light-text hover:bg-dark-surface hover:no-underline">Sorteo</a>
      <a href="roulette.html"
        class="inline-flex items-center gap-1 px-4 py-2 rounded-md text-sm font-semibold whitespace-nowrap transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-light text-light-muted hover:text-light-text hover:bg-dark-surface hover:no-underline">Ruleta</a>
      <a href="dice.html"
        class="inline-flex items-center gap-1 px-4 py-2 rounded-md text-sm font-semibold whitespace-nowrap transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-light text-light-muted hover:text-light-text hover:bg-dark-surface hover:no-underline">Dados</a>
    </nav>
  </header>

  <main class="p-6 w-full mx-auto grid grid-cols-1 lg:grid-cols-[1fr_280px] gap-6 max-w-[1200px]" role="main">
    <section class="min-w-0 animate-fade-in" id="section-teams" aria-label="Generador de equipos">
      <header class="mb-8">
        <h1 class="text-2xl font-bold mb-2">Generador de Equipos</h1>
        <p class="text-sm text-light-muted">Ingresa participantes y define como agruparlos.</p>
      </header>

      <form class="space-y-6" id="team-form" aria-label="Formulario de generacion de equipos">
        <p class="flex flex-col gap-1">
          <label class="text-sm font-semibold text-light-muted" for="team-participants">Participantes (uno por
            linea)</label>
          <textarea
            class="px-4 py-2 bg-dark-surface border border-dark-border rounded-md text-light-text transition-colors focus:border-primary focus:outline-none focus:ring-[3px] focus:ring-primary/25 resize-y min-h-[120px]"
            id="team-participants" rows="6" placeholder="Ana&#10;Carlos&#10;Maria&#10;..."
            aria-required="true"></textarea>
        </p>

        <fieldset class="space-y-4">
          <legend class="sr-only">Modo de agrupacion</legend>

          <p class="flex flex-col gap-1">
            <label class="text-sm font-semibold text-light-muted">Agrupar por</label>
          <menu class="flex gap-2">
            <li><button type="button"
                class="inline-flex items-center justify-center gap-2 rounded-md font-semibold transition-all duration-150 disabled:opacity-50 px-2 py-1 text-xs bg-primary text-white hover:bg-primary-dark hover:-translate-y-[1px] hover:shadow-md is-active-mode"
                id="mode-group-count" aria-pressed="true">
                Cantidad de grupos
              </button></li>
            <li><button type="button"
                class="inline-flex items-center justify-center gap-2 rounded-md font-semibold transition-all duration-150 disabled:opacity-50 px-2 py-1 text-xs bg-dark-surface text-light-text border border-dark-border hover:bg-dark-surface-hover hover:border-primary"
                id="mode-group-size" aria-pressed="false">
                Tamano de grupo
              </button></li>
          </menu>
          </p>

          <p class="flex flex-col gap-1">
            <label class="text-sm font-semibold text-light-muted" for="team-value" id="team-value-label">Cantidad de
              grupos</label>
            <input
              class="px-4 py-2 bg-dark-surface border border-dark-border rounded-md text-light-text transition-colors focus:border-primary focus:outline-none focus:ring-[3px] focus:ring-primary/25 max-w-[120px]"
              type="number" id="team-value" min="2" value="2" aria-labelledby="team-value-label">
          </p>
        </fieldset>

        <details class="border border-dark-border rounded-md overflow-hidden group">
          <summary
            class="w-full p-4 text-left font-semibold text-sm bg-dark-surface flex justify-between items-center cursor-pointer">
            Reglas avanzadas
            <span class="transition-transform group-open:rotate-90">▸</span>
          </summary>
          <div class="p-4 space-y-4">
            <p class="text-sm">
              Agrega pares de participantes que <strong>no</strong> deben estar en el mismo equipo.
            </p>
            <p class="flex flex-wrap gap-2 items-center" id="exclusion-form">
              <input
                class="flex-1 min-w-[120px] px-4 py-2 bg-dark-surface border border-dark-border rounded-md text-light-text transition-colors focus:border-primary focus:outline-none focus:ring-[3px] focus:ring-primary/25"
                type="text" id="exclusion-a" placeholder="Participante A" aria-label="Participante A de la exclusion">
              <input
                class="flex-1 min-w-[120px] px-4 py-2 bg-dark-surface border border-dark-border rounded-md text-light-text transition-colors focus:border-primary focus:outline-none focus:ring-[3px] focus:ring-primary/25"
                type="text" id="exclusion-b" placeholder="Participante B" aria-label="Participante B de la exclusion">
              <button type="button"
                class="inline-flex items-center justify-center gap-2 rounded-md font-semibold transition-all duration-150 disabled:opacity-50 px-2 py-1 text-xs bg-dark-surface text-light-text border border-dark-border hover:bg-dark-surface-hover hover:border-primary"
                id="add-exclusion-btn" aria-label="Agregar regla de exclusion">+ Agregar</button>
            </p>
            <ul class="flex flex-wrap gap-2" id="exclusion-list" aria-label="Reglas de exclusion activas"></ul>
          </div>
        </details>

        <p>
          <button type="submit"
            class="inline-flex items-center justify-center gap-2 rounded-md font-semibold transition-all duration-150 disabled:opacity-50 px-8 py-4 text-lg w-full bg-primary text-white hover:bg-primary-dark hover:-translate-y-[1px] hover:shadow-md">Generar
            Equipos</button>
        </p>
      </form>

      <output id="team-results" class="grid grid-cols-[repeat(auto-fill,minmax(250px,1fr))] gap-4 mt-8"
        aria-live="polite" aria-label="Equipos generados"></output>
    </section>

    <aside
      class="hidden lg:block bg-dark-bg-alt border border-dark-border rounded-lg p-6 overflow-y-auto max-h-[calc(100vh-3.5rem-3rem)] sticky top-[calc(3.5rem+1.5rem)] self-start"
      id="history-aside" aria-label="Historial de operaciones">
      <header class="flex justify-between items-center mb-4">
        <h2 class="font-bold">Historial</h2>
        <button type="button"
          class="inline-flex items-center justify-center gap-2 rounded-md font-semibold transition-all duration-150 disabled:opacity-50 px-2 py-1 text-xs bg-danger text-white hover:bg-danger-dark"
          id="clear-history-btn" aria-label="Limpiar historial">Limpiar</button>
      </header>
      <ul id="history-list" aria-live="polite" class="divide-y divide-dark-border"></ul>
    </aside>
  </main>

  <button type="button"
    class="fixed bottom-4 right-4 w-12 h-12 bg-primary rounded-full text-white text-xl z-[100] lg:hidden flex items-center justify-center shadow-lg hover:bg-primary-dark hover:-translate-y-1 transition-all"
    id="history-toggle-btn" aria-label="Abrir historial">&#9201;</button>

  <script type="module" src="js/app.js"></script>
</body>

</html>
